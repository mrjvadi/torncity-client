; Client configuration. Copy to config/client.local.cfg (git-ignored) or to
; user://client.cfg to override any key; command-line and web query
; parameters override both (see docs/running.md).

[server]
; Base URL of the game API (no trailing slash). Empty on the web build means
; "the origin the page was served from".
api_url="http://127.0.0.1:8080"
; Centrifugo WebSocket endpoint (JSON protocol).
realtime_url="ws://127.0.0.1:8000/connection/websocket"

[mode]
; true: run fully offline against the built-in mock server (fixtures).
mock=true
; In mock mode, pretend to run inside Telegram as a Mini App (initData login).
mock_telegram=false

[ui]
; Default language when neither Telegram nor the player chose one.
lang="fa"
